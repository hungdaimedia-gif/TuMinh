[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tuminh-agent"
version = "0.1.0"
description = "A bounded autonomous coding agent starter"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
