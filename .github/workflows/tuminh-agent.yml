name: TuMinh Autonomous Agent

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  agent-runner:
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/tuminh'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure Git identity
        run: |
          git config --global user.name "TuMinh Agent [bot]"
          git config --global user.email "tuminh-agent@users.noreply.github.com"

      - name: Verify API Key Secret
        env:
          KEY_CHECK: ${{ secrets.GROQ_API_KEY || secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$KEY_CHECK" ]; then
            echo "::error::API key secret is missing. Please add GROQ_API_KEY or MODEL_API_KEY to Repository Secrets."
            exit 1
          fi

      - name: Run TuMinh Agent on Issue
        env:
          MODEL_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL || 'https://api.groq.com/openai/v1' }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'qwen/qwen3.8-27b' }}
          TASK_SOURCE: github
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_PULL_REQUEST: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --once
